<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>ShortHub</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔗</text></svg>">
<!--
  404.html trick for GitHub Pages:
  When GitHub Pages can't find a path, it serves this 404.html.
  We inspect the path; if it matches /s/<code>, we redirect to the
  actual redirector page at /s/?c=<code>.

  NOTE: This file MUST live at the repository root so GitHub Pages
  uses it for all unmatched routes. For project pages
  (https://<user>.github.io/<repo>/), GitHub Pages automatically
  serves this 404.html for any unmatched path under the repo.

  IMPORTANT: All asset paths in this file are computed at runtime
  because the 404 page can be served from any path. We use a
  <base> tag injected by JS to fix relative URLs.
-->
<style>
  html, body { margin: 0; padding: 0; background: #0b0f17; color: #e5e7eb;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  body { min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; }
  .card { background: #161b26; border: 1px solid #1f2937; border-radius: 16px;
    padding: 2rem 1.75rem; max-width: 440px; width: 100%; text-align: center; }
  .icon { width: 56px; height: 56px; margin: 0 auto 1rem; border-radius: 50%;
    background: linear-gradient(135deg, #dc2626, #f97316); display: grid; place-items: center; color: white; }
  h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
  p { color: #9ca3af; margin: 0 0 1.25rem; font-size: 0.9rem; line-height: 1.5; }
  a { color: #f97316; text-decoration: none; font-weight: 600; }
  a:hover { text-decoration: underline; }
  .spinner { width: 22px; height: 22px; border: 3px solid #1f2937;
    border-top-color: #f97316; border-radius: 50%; animation: spin 0.8s linear infinite;
    margin: 0 auto 1rem; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .meta { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.78rem;
    color: #6b7280; word-break: break-all; background: #0b0f17; border: 1px dashed #1f2937;
    padding: 0.6rem 0.8rem; border-radius: 8px; margin-bottom: 1rem; }
  code { background: #0b0f17; padding: 0.1em 0.35em; border-radius: 4px; font-family: inherit;
    color: #f97316; }
</style>
</head>
<body>
<div class="card">
  <div class="spinner"></div>
  <h1 id="title">Memproses shortlink…</h1>
  <p id="message">Mohon tunggu, kami sedang mengarahkan Anda.</p>
  <div id="metaBox" class="meta" style="display:none;"></div>
  <p><a id="homeLink" href="#">← Kembali ke beranda</a></p>
</div>

<script>
(function () {
  "use strict";

  // Detect the base path (repo prefix for GitHub project pages).
  // Examples:
  //   https://user.github.io/             → base = ""
  //   https://user.github.io/repo/        → base = "/repo"
  //   https://user.github.io/repo/s/code  → base = "/repo"
  //   https://custom.com/                 → base = ""
  //   https://custom.com/repo/s/code      → base = "/repo"
  function detectBasePath() {
    var path = window.location.pathname.replace(/\/+$/, ""); // trim trailing slashes
    // Try to match /s/<code> at the end
    var m = path.match(/^(.*)\/s\/[^/]+$/);
    if (m) {
      // base is everything before /s/<code>
      var b = m[1];
      return b || "";
    }
    // Otherwise, check if first segment looks like a repo (project pages)
    // We can't reliably detect this for arbitrary paths, so default to ""
    // (covers user pages, custom domains, and root-level deployments).
    return "";
  }

  var base = detectBasePath();
  var homeLink = document.getElementById("homeLink");
  if (homeLink) homeLink.setAttribute("href", base + "/");

  var path = window.location.pathname;
  var titleEl = document.getElementById("title");
  var msgEl = document.getElementById("message");
  var metaBox = document.getElementById("metaBox");

  // Extract /s/<code> from the path. Be tolerant of trailing slashes.
  var match = path.match(/\/s\/([^/?#]+)/);
  if (!match) {
    titleEl.textContent = "Halaman tidak ditemukan";
    msgEl.innerHTML = "URL <code>" + escapeHtml(path) + "</code> tidak dikenali. " +
      "Periksa kembali atau kembali ke beranda untuk membuat shortlink baru.";
    return;
  }

  var code = decodeURIComponent(match[1]);
  metaBox.style.display = "block";
  metaBox.textContent = "code: " + code;

  // Redirect to /s/?c=<code> (loads /s/index.html — the actual redirector).
  // Use absolute path with detected base.
  var redirect = base + "/s/?c=" + encodeURIComponent(code);
  // Use replace so this 404 page doesn't get stuck in browser history.
  window.location.replace(redirect);

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
})();
</script>
</body>
</html>
