name: Update Articles

on:
  schedule:
    # Runs daily at 07:00 UTC (14:00 WIB)
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-articles
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch RSS and update articles.json
        run: |
          python scripts/build_articles_json.py data/articles.json
        working-directory: ${{ github.workspace }}

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet data/articles.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes — articles.json is up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat data/articles.json
          fi

      - name: Commit & push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/articles.json
          git commit -m "chore(data): auto-update articles from brightdailyhub.my.id

          Fetched at: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          Source: https://brightdailyhub.my.id/feed.php"
          git push
